<!doctype html>
<html>
<body style="font-family:Arial;font-size:64px;padding:80px">
  <div id="out"></div>
  <script>
    document.getElementById('out').innerHTML =
      'innerWidth: ' + window.innerWidth + '<br>' +
      'innerHeight: ' + window.innerHeight + '<br>' +
      'screen.width: ' + screen.width + '<br>' +
      'screen.height: ' + screen.height + '<br>' +
      'devicePixelRatio: ' + window.devicePixelRatio;
  </script>
</body>
</html>
