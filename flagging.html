<!doctype html>
<html lang="fo">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flagging</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #555555;
      --accent: #0065a8;

      /*
        Responsiv støddarstýring.
        max(1vw, 1vh) ger, at teksturin ikki verður ov lítil,
        um MagicInfo/browserin rapporterar skermin øvugt ella løgið.
      */
      --unit: max(1vw, 1vh);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 6vh, 100px) clamp(28px, 7vw, 120px);
      text-align: center;
      position: relative;
    }

    .card {
      width: min(100%, 1200px);
      margin: 0 auto;
    }

    .flag {
      font-size: clamp(86px, calc(var(--unit) * 8.5), 170px);
      line-height: 1;
      margin-bottom: clamp(22px, 3vh, 58px);
    }

    .kicker {
      font-size: clamp(24px, calc(var(--unit) * 2.1), 44px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.10em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: clamp(24px, 3vh, 60px);
    }

    .title {
      font-size: clamp(58px, calc(var(--unit) * 5.8), 112px);
      line-height: 1.06;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin: 0 0 clamp(24px, 3vh, 62px) 0;
    }

    .text {
      font-size: clamp(32px, calc(var(--unit) * 3.1), 62px);
      line-height: 1.28;
      margin: 0 auto;
      max-width: 1050px;
      font-weight: 500;
    }

    .mode {
      font-size: clamp(26px, calc(var(--unit) * 2.4), 46px);
      color: var(--muted);
      margin-top: clamp(24px, 3.3vh, 64px);
      font-weight: 500;
    }

    .qr-section {
      display: none;
      margin-top: clamp(34px, 5vh, 90px);
      text-align: center;
    }

    .qr-image {
      width: clamp(240px, calc(var(--unit) * 25), 440px);
      height: clamp(240px, calc(var(--unit) * 25), 440px);
      border: 14px solid #ffffff;
      border-radius: 22px;
      box-shadow: 0 0 0 2px #e8edf2;
      background: #ffffff;
    }

    .qr-label {
      margin-top: clamp(16px, 2vh, 36px);
      font-size: clamp(24px, calc(var(--unit) * 2), 38px);
      color: var(--muted);
      line-height: 1.25;
    }

    .has-qr .qr-section {
      display: block;
    }

    .quote-only {
      display: none;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .quote-text {
      margin: 0 auto;
      font-size: clamp(46px, calc(var(--unit) * 5.2), 100px);
      line-height: 1.16;
      font-weight: 900;
      letter-spacing: -0.035em;
      max-width: 1100px;
    }

    .quote-author {
      margin: clamp(36px, 6vh, 100px) 0 0 0;
      font-size: clamp(26px, calc(var(--unit) * 2.4), 48px);
      line-height: 1.3;
      color: var(--muted);
      font-weight: 500;
    }

    .standard .flag,
    .standard .kicker,
    .standard .title,
    .standard .text,
    .standard .mode,
    .standard .qr-section {
      display: none;
    }

    .standard .quote-only {
      display: block;
    }

    /*
      Smalir/loddrættir skermar: minni luft og eitt sindur smalri tekst.
    */
    @media (max-aspect-ratio: 3/4) {
      .screen {
        padding: clamp(28px, 5.5vh, 90px) clamp(24px, 6vw, 80px);
      }

      .card,
      .quote-only {
        max-width: 900px;
      }

      .title {
        font-size: clamp(58px, calc(var(--unit) * 5.4), 108px);
      }

      .quote-text {
        font-size: clamp(48px, calc(var(--unit) * 5.0), 96px);
      }

      .qr-image {
        width: clamp(260px, calc(var(--unit) * 23), 420px);
        height: clamp(260px, calc(var(--unit) * 23), 420px);
      }
    }

    /*
      Breiðir skermar: halt innihaldið savnað mitt á skerminum.
    */
    @media (min-aspect-ratio: 4/3) {
      .card,
      .quote-only {
        max-width: 1300px;
      }

      .quote-text {
        max-width: 1250px;
      }
    }

    /*
      Smáir preview-skermar í browserinum.
    */
    @media (max-width: 700px), (max-height: 700px) {
      .screen {
        padding: 5vh 6vw;
      }

      .flag {
        font-size: clamp(50px, calc(var(--unit) * 7), 100px);
      }

      .kicker {
        font-size: clamp(16px, calc(var(--unit) * 1.8), 28px);
      }

      .title {
        font-size: clamp(34px, calc(var(--unit) * 4.6), 68px);
      }

      .text {
        font-size: clamp(20px, calc(var(--unit) * 2.6), 42px);
      }

      .mode,
      .quote-author,
      .qr-label {
        font-size: clamp(16px, calc(var(--unit) * 1.8), 30px);
      }

      .quote-text {
        font-size: clamp(28px, calc(var(--unit) * 4.2), 72px);
      }

      .qr-image {
        width: clamp(150px, calc(var(--unit) * 19), 300px);
        height: clamp(150px, calc(var(--unit) * 19), 300px);
      }
    }
  </style>
</head>
<body>
  <main id="screen" class="screen">
    <div class="card">
      <div id="flag" class="flag">🇫🇴</div>
      <div id="kicker" class="kicker">Flaggdagur í dag</div>
      <h1 id="title" class="title"></h1>
      <p id="text" class="text"></p>
      <div id="mode" class="mode"></div>
      <div id="qrSection" class="qr-section">
        <img id="qrImage" class="qr-image" alt="QR-koda til meiri kunning" />
        <div id="qrLabel" class="qr-label">Skanna og les meira</div>
      </div>

      <section id="quoteOnly" class="quote-only" aria-label="Dagsins sitat">
        <p id="quoteText" class="quote-text"></p>
        <p id="quoteAuthor" class="quote-author"></p>
      </section>
    </div>
  </main>

  <script>
    // Test/simulering:
    //   flagging.html?date=2026-04-25
    // Vanlig nýtsla:
    //   flagging.html

    const fixedFlagDays = [
      { day: 1, month: 1, title: 'Nýggjársdagur', text: 'Í dag er nýggjársdagur.', mode: 'Full stong' },
      { day: 5, month: 2, title: 'Føðingardagur drotningarinnar', text: 'Í dag er føðingardagur drotningarinnar.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/Dronning_Mary_af_Danmark' },
      { day: 6, month: 2, title: 'Samiskur flaggdagur', text: 'Í dag er samiskur flaggdagur.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/Samefolkets_dag' },
      { day: 8, month: 3, title: 'Altjóða kvinnudagur', text: 'Í dag er altjóða kvinnudagur.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/Kvindernes_internationale_kampdag' },
      { day: 12, month: 3, title: 'Grækarismessa', text: 'Í dag er Grækarismessa.', mode: 'Full stong', infoUrl: 'https://fo.wikipedia.org/wiki/Gr%C3%A6karismessa' },
      { day: 23, month: 3, title: 'Norðurlandadagur', text: 'Í dag er Norðurlandadagur.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/Nordens_dag' },
      { day: 16, month: 4, title: 'Føðingardagur Hennara hátign Margretha II', text: 'Í dag er føðingardagur Hennara hátign Margretha II.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/Margrethe_2.' },
      { day: 25, month: 4, title: 'Flaggdagur', text: 'Í dag er Flaggdagur. Merkið varð viðurkent 25. apríl 1940.', mode: 'Full stong', infoUrl: 'https://fo.wikipedia.org/wiki/Flaggdagur' },
      { day: 1, month: 5, title: 'Altjóða arbeiðaradagur', text: 'Í dag er altjóða arbeiðaradagur.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/Arbejdernes_internationale_kampdag' },
      { day: 17, month: 5, title: 'Tjóðardagur Noregs', text: 'Í dag er tjóðardagur Noregs.', mode: 'Full stong', infoUrl: 'https://lex.dk/17._maj_-_Norges_nationaldag' },
      { day: 26, month: 5, title: 'Føðingardagur kongsins', text: 'Í dag er føðingardagur kongsins.', mode: 'Full stong', infoUrl: 'https://lex.dk/Frederik_10._-_konge_af_Danmark' },
      { day: 5, month: 6, title: 'Grundlógardagur danska ríkisins', text: 'Í dag er grundlógardagur danska ríkisins.', mode: 'Full stong', infoUrl: 'https://lex.dk/grundlovsdag' },
      { day: 6, month: 6, title: 'Tjóðardagur Svøríkis', text: 'Í dag er tjóðardagur Svøríkis.', mode: 'Full stong', infoUrl: 'https://lex.dk/Sverige' },
      { day: 9, month: 6, title: 'Tjóðardagur Álands', text: 'Í dag er tjóðardagur Álands.', mode: 'Full stong', infoUrl: 'https://lex.dk/%C3%85land' },
      { day: 17, month: 6, title: 'Tjóðardagur Íslands', text: 'Í dag er tjóðardagur Íslands.', mode: 'Full stong', infoUrl: 'https://lex.dk/Island' },
      { day: 21, month: 6, title: 'Tjóðardagur Grønlands', text: 'Í dag er tjóðardagur Grønlands.', mode: 'Full stong', infoUrl: 'https://trap-groenland.lex.dk/Gr%C3%B8nland' },
      { day: 24, month: 6, title: 'Jóansøka', text: 'Í dag er Jóansøka.', mode: 'Full stong', infoUrl: 'https://fo.wikipedia.org/wiki/J%C3%B3ans%C3%B8ka' },
      { day: 28, month: 7, title: 'Ólavsøkuaftan', text: 'Í dag er Ólavsøkuaftan.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/%C3%93lavs%C3%B8ka' },
      { day: 29, month: 7, title: 'Ólavsøkudagur', text: 'Í dag er Ólavsøkudagur.', mode: 'Full stong', infoUrl: 'https://da.wikipedia.org/wiki/%C3%93lavs%C3%B8ka' },
      { day: 15, month: 10, title: 'Føðingardagur krúnprinsins', text: 'Í dag er føðingardagur krúnprinsins.', mode: 'Full stong', infoUrl: 'https://lex.dk/Christian_-_kronprins_til_Danmark' },
      { day: 24, month: 10, title: 'Dagur Sameindu Tjóða', text: 'Í dag er dagur Sameindu Tjóða.', mode: 'Full stong', infoUrl: 'https://lex.dk/FN_-_Forenede_Nationer' },
      { day: 1, month: 11, title: 'Alhalgunadagur / Minningardagur teirra sjólátnu', text: 'Í dag er Alhalgunadagur og minningardagur teirra sjólátnu.', mode: 'Hálv stong', infoUrl: 'https://fo.wikipedia.org/wiki/Allahalgannadagur' },
      { day: 6, month: 12, title: 'Tjóðardagur Finnlands', text: 'Í dag er tjóðardagur Finnlands.', mode: 'Full stong', infoUrl: 'https://lex.dk/Finland' },
      { day: 25, month: 12, title: 'Jóladagur', text: 'Í dag er Jóladagur.', mode: 'Full stong' }
    ];

    const quotes = [
      { text: 'Heilin verður ongantíð útlúgvaður av at læra.', author: 'Leonardo da Vinci, 1452–1519' },
      { text: 'Lærdómur er lættur at bera.', author: 'Føroyskt orðatak' },
      { text: 'Heilin er ikki eitt skip, sum vit skulu fylla, men eitt bál, sum vit skulu kynda.', author: 'Plutarch, uml. 46–120' },
      { text: 'Tað vakra við lærdómi er, at ongin kann taka hann frá tær.', author: 'B.B. King, 1925–2015' },
      { text: 'Liv sum um tú skuldi doyð í morgin. Lær sum um tú skuldi livað í allar ævir.', author: 'Mahatma Gandhi, 1869–1948' },
      { text: 'Ungur nemur, gamal fremur.', author: 'Føroyskt orðatak' },
      { text: 'Sig mær, og eg gloymi, lær meg, og eg minnist kanska, tak meg uppí, og eg læri.', author: 'Benjamin Franklin, 1706–1790' },
      { text: 'At læra er ein skattur, sum fylgir sínum eigara allastaðni.', author: 'Kinesiskt orðatak' },
      { text: 'Stúr ikki fyri, at tú stríðist við støddfrøðina. Eg kann vissa teg í, at eg stríðist meira.', author: 'Albert Einstein, 1879–1955' },
      { text: 'Útbúgving er sterkasta vápnið, sum tú kanst brúka til at broyta verðina.', author: 'Nelson Mandela, 1918–2013' },
      { text: 'At læra er sum at rógva móti streyminum. Gevst tú, fert tú rekandi aftur.', author: 'Laozi, livdi í 6. øld f.Kr. í Kina' },
      { text: 'Tað er ikki nóg mikið at vita, tú noyðist eisini at nýta vitanina.', author: 'Johann Wolfgang von Goethe, 1749–1832' },
      { text: 'Einasti møguleikin at gera framúr arbeiði er at elska tað, mann ger.', author: 'Steve Jobs, 1955–2011' },
      { text: 'Vitan snakkar, men vísdómur lurtar.', author: 'Jimi Hendrix, 1942–1970' },
      { text: 'Eg havi ongar serligar gávur. Eg eri bara inniliga forvitin.', author: 'Albert Einstein, 1879–1955' },
      { text: 'Tú lærir ikki at ganga av at fylgja reglum. Tú lærir av at gera og at detta.', author: 'Richard Branson, 1950' },
      { text: 'Ger íløgu í teg sjálvan. Tað gevur tær bestu rentuna.', author: 'Benjamin Franklin, 1706–1790' },
      { text: 'Lívið er sum at súkkla. Fyri at vera í javnvág, noyðist tú at vera í rørslu.', author: 'Albert Einstein, 1879–1955' },
      { text: 'Tann, sum ikki dugir fremmandamál, veit onki um sítt egna.', author: 'Johann Wolfgang von Goethe, 1749–1832' }
    ];

    function easterDate(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day, 12, 0, 0);
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function sameDate(a, b) {
      return a.getFullYear() === b.getFullYear() &&
             a.getMonth() === b.getMonth() &&
             a.getDate() === b.getDate();
    }

    function movableFlagDays(year) {
      const easter = easterDate(year);
      return [
        { date: addDays(easter, -2), title: 'Langifríggjadagur', text: 'Í dag er Langifríggjadagur.', mode: 'Hálv stong' },
        { date: easter, title: 'Páskadagur', text: 'Í dag er Páskadagur.', mode: 'Full stong' },
        { date: addDays(easter, 39), title: 'Kristi himmalferðardagur', text: 'Í dag er Kristi himmalferðardagur.', mode: 'Full stong' },
        { date: addDays(easter, 49), title: 'Hvítusunnudagur', text: 'Í dag er Hvítusunnudagur.', mode: 'Full stong' }
      ];
    }

    function getSelectedDate() {
      const params = new URLSearchParams(window.location.search);
      const testDate = params.get('date');
      if (testDate && /^\d{4}-\d{2}-\d{2}$/.test(testDate)) {
        return new Date(testDate + 'T12:00:00');
      }
      return new Date();
    }

    function findFlagDay(date) {
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const year = date.getFullYear();

      const fixed = fixedFlagDays.find(item => item.day === day && item.month === month);
      if (fixed) return fixed;

      const movable = movableFlagDays(year).find(item => sameDate(item.date, date));
      if (movable) return movable;

      return null;
    }

    function dayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function getQuoteForDate(date) {
      const index = (dayOfYear(date) - 1) % quotes.length;
      return quotes[index];
    }


    function qrCodeUrl(url) {
      return 'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=12&data=' + encodeURIComponent(url);
    }

    function showQrForFlagDay(flagDay) {
      const qrSection = document.getElementById('qrSection');
      const qrImage = document.getElementById('qrImage');
      const qrLabel = document.getElementById('qrLabel');

      if (flagDay.infoUrl) {
        document.getElementById('screen').classList.add('has-qr');
        qrImage.src = qrCodeUrl(flagDay.infoUrl);
        qrLabel.textContent = 'Skanna og les meira';
      } else {
        document.getElementById('screen').classList.remove('has-qr');
        qrImage.removeAttribute('src');
        qrLabel.textContent = '';
      }
    }

    function render() {
      const selectedDate = getSelectedDate();
      const flagDay = findFlagDay(selectedDate);
      const screen = document.getElementById('screen');

      if (flagDay) {
        screen.classList.remove('standard');
        document.getElementById('flag').textContent = '🇫🇴';
        document.getElementById('kicker').textContent = 'Flaggdagur í dag';
        document.getElementById('title').textContent = flagDay.title;
        document.getElementById('text').textContent = flagDay.text;
        document.getElementById('mode').textContent = flagDay.mode;
        showQrForFlagDay(flagDay);
      } else {
        const quote = getQuoteForDate(selectedDate);
        screen.classList.add('standard');
        screen.classList.remove('has-qr');
        document.getElementById('quoteText').textContent = '“' + quote.text + '”';
        document.getElementById('quoteAuthor').textContent = quote.author;
      }
    }

    render();
  </script>
</body>
</html>
